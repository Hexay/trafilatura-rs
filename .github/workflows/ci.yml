name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: pytest (Python ${{ matrix.python }}, parity vs trafilatura ${{ matrix.trafilatura }} + lxml ${{ matrix.lxml }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
        trafilatura: ["1.11.0", "2.3.1"]
        lxml: ["6.1.3"]
        include:
          - trafilatura: "1.11.0"
            extra: test
          - trafilatura: "2.3.1"
            extra: test2
    steps:
      - uses: actions/checkout@v7
      # The parity corpus and its references were produced on Python 3.13 (tools/dev.sh setup).
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
      - name: Install wheel with ${{ matrix.extra }} extra
        run: |
          wheel=$(ls dist/*.whl)
          python -m pip install "${wheel}[${{ matrix.extra }}]" "lxml==${{ matrix.lxml }}"
          python -m pip list | grep -iE "^(trafilatura|lxml|justext) "
      - run: python -m pytest -q tests
