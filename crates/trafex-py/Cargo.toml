[package]
name = "trafex-py"
description = "Python bindings for trafex (byte-exact trafilatura extraction)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
trafex = { path = "../trafex" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
