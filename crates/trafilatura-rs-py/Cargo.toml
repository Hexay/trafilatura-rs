[package]
name = "trafilatura-rs-py"
description = "Python bindings for trafilatura-rs (byte-exact trafilatura extraction)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
trafilatura-rs = { path = "../trafilatura-rs" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
