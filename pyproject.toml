[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "trafilatura-rs"
version = "0.1.2"
description = "Byte-exact drop-in Rust port of trafilatura 1.11's and 2.3's extract()"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Hexay" }]
requires-python = ">=3.10"
keywords = ["trafilatura", "html", "text-extraction", "boilerplate-removal", "web-scraping", "datatrove", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Hexay/trafilatura-rs"
Repository = "https://github.com/Hexay/trafilatura-rs"
Issues = "https://github.com/Hexay/trafilatura-rs/issues"

[project.optional-dependencies]
# install() patches trafilatura; the parity guarantee is against these exact (trafilatura, lxml) pairs (and htmldate
# for 1.11 metadata).
trafilatura = ["trafilatura==1.11.0", "lxml==6.1.3", "htmldate==1.11.0"]
trafilatura2 = ["trafilatura==2.3.1", "lxml==6.1.3"]
# Pins that affect extract() output: tools/requirements.txt (1.11.0) and the .venv-t23 setup in tools/dev.sh (2.3.1).
test = ["pytest", "trafilatura==1.11.0", "lxml==6.1.3", "lxml-html-clean==0.4.6", "justext==3.0.2",
        "courlan==1.4.0", "htmldate==1.11.0", "dateparser==1.5.0", "python-dateutil==4.0.0"]
test2 = ["pytest", "trafilatura==2.3.1", "lxml==6.1.3", "lxml-html-clean==0.4.6", "justext==3.0.2",
         "courlan==1.4.0", "htmldate==1.11.0", "dateparser==1.5.0", "python-dateutil==4.0.0", "charset-normalizer==3.5.2"]

[tool.maturin]
manifest-path = "crates/trafilatura-rs-py/Cargo.toml"
python-source = "python"
module-name = "trafilatura_rs._core"
# The release profile keeps debug info for perf; shipped wheels don't need it.
strip = true
include = [{ path = "python/trafilatura_rs.pth", format = "wheel" }]
