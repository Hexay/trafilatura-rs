[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "trafex"
version = "0.1.0"
description = "Byte-exact Rust port of trafilatura's text extraction"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# install() patches trafilatura; the parity guarantee is against these exact versions.
trafilatura = ["trafilatura==1.11.0", "lxml==6.1.3"]

[tool.maturin]
manifest-path = "crates/trafex-py/Cargo.toml"
python-source = "python"
module-name = "trafex._core"
