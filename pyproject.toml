[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "trafex"
version = "0.1.0"
description = "Byte-exact Rust port of trafilatura's text extraction"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Hexay" }]
requires-python = ">=3.10"
keywords = ["trafilatura", "html", "text-extraction", "boilerplate-removal", "web-scraping", "datatrove", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Hexay/trafex"
Repository = "https://github.com/Hexay/trafex"
Issues = "https://github.com/Hexay/trafex/issues"

[project.optional-dependencies]
# install() patches trafilatura; the parity guarantee is against these exact versions.
trafilatura = ["trafilatura==1.11.0", "lxml==6.1.3"]
# Pins of tools/requirements.txt that affect extract() output.
test = ["pytest", "trafilatura==1.11.0", "lxml==6.1.3", "lxml-html-clean==0.4.6", "justext==3.0.2",
        "courlan==1.4.0", "htmldate==1.11.0"]

[tool.maturin]
manifest-path = "crates/trafex-py/Cargo.toml"
python-source = "python"
module-name = "trafex._core"
# The release profile keeps debug info for perf; shipped wheels don't need it.
strip = true
