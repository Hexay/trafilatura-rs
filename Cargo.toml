[workspace]
resolver = "2"
members = ["crates/libxml2-sys", "crates/trafilatura-rs", "crates/harness", "crates/trafilatura-rs-py"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

# edit → parity loop (tools/dev.sh build|py default); benches and wheels use release, see CONTRIBUTING.md
[profile.iter]
inherits = "release"
lto = false
codegen-units = 16
debug = 0
incremental = true

# release with full debug info, for perf/samply (pair with frame pointers, see CONTRIBUTING.md)
[profile.profiling]
inherits = "release"
debug = 2
